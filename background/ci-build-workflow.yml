name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # native runners: no cross toolchain / sysroot games needed.
    # ubuntu-24.04-arm is free for public repositories.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          cc --version | head -1
          make --version | head -1

      - name: build static binary
        run: make STATIC=1

      - name: report
        run: |
          mv build/q8b-fan build/q8b-fan-${{ matrix.arch }}
          ls -l build/
          file build/q8b-fan-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: q8b-fan-${{ matrix.arch }}
          path: build/q8b-fan-${{ matrix.arch }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
